# Render Blueprint — NurChat relay on the free tier ($0) + Supabase Postgres.
# Deploy: dashboard.render.com → New → Blueprint → connect repo.
#
# DATABASE: Render's free Postgres EXPIRES AFTER 90 DAYS (data deleted!),
# so this blueprint expects an EXTERNAL database — Supabase free tier
# (500 MB, no expiry, pauses after 7d idle but our /health pings every
# 10 min via cron-job.org keep it awake). See DEPLOY.md section $0.
#
# Supabase setup (5 min, no card):
#   1. supabase.com → New project (free) → wait for provisioning.
#   2. Project Settings → Database → Connection string (URI):
#      postgresql://postgres:[PASSWORD]@db.[REF].supabase.co:5432/postgres
#      (URL-encode special chars in password: @ → %40, # → %23, etc.)
#   3. Paste as DATABASE_URL secret env in Render dashboard (see below).
#   4. Tables are created automatically on first boot (alembic upgrade head
#      runs as preDeployCommand AND as create_all fallback in lifespan).
services:
  - type: web
    name: nurchat-relay
    runtime: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      # Paste your Supabase URI in the Render dashboard (sync: false).
      - key: DATABASE_URL
        sync: false
      - key: USE_REDIS
        value: "false"
      - key: DEBUG
        value: "False"
      - key: RELAY_DEAF
        value: "true"
      - key: MESSAGE_RETENTION_HOURS
        value: "48"
      - key: LOG_IPS
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.0
      # Generate once and paste as secret env vars in dashboard:
      #   python -c "import secrets; print(secrets.token_hex(32))"  ×2
      #   python -c "import secrets; print(secrets.token_urlsafe(32))" ×1
      # Reuse the SAME values if you ever recreate the service,
      # otherwise sessions and 2FA secrets become undecryptable.
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOTP_MASTER_KEY
        sync: false
