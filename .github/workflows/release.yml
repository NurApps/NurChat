name: Release

on:
  push:
    tags:
      - 'v*'

      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install root deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build server.exe
        run: |
          pyinstaller --onefile --noconsole --name server.exe `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.lifespan.on" `
            --add-data "shared;shared" `
            --collect-all "multipart" `
            server\main.py `
            --noconfirm

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install root deps
        run: npm install

      - name: Build app (Tauri)
        run: npx --yes tauri build --config src-tauri/tauri.conf.json

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NurChat ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist/server.exe
          fail_on_unmatched_files: true

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NurChat ${{ github.ref_name }}"
          releaseBody: "См. вложения для скачивания."
          releaseDraft: false
          prerelease: false
          args: "--config src-tauri/tauri.conf.json"
