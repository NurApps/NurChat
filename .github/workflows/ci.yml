name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run crypto tests
        run: pytest test/test_crypto.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

  build-windows:
    runs-on: windows-latest
    needs: [test, lint]
    if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root dependencies
        shell: cmd
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        shell: cmd
        run: npx tauri build
        working-directory: src-tauri

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: NurChat-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/NurChat_*.exe
          if-no-files-found: warn

      - name: Download WebView2 bootstrapper
        run: |
          curl -L -o WebView2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
        shell: bash

      - name: Upload WebView2 bootstrapper
        uses: actions/upload-artifact@v4
        with:
          name: WebView2Setup
          path: WebView2Setup.exe
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Beta ${{ github.ref_name }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/NurChat-windows-x64-setup/*.exe
            artifacts/WebView2Setup/WebView2Setup.exe
