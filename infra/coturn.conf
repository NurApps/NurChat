# NurChat TURN/STUN Server Configuration
# Used by docker-compose coturn service

listening-port=3478
tls-listening-port=5349

# Internal IP (Docker network)
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=0.0.0.0

# Relay ports
min-port=49152
max-port=65535

# Auth — use long-term credentials
lt-cred-mech
user=nurchat:turn-secret
realm=nurchat.local

# Logging
verbose
log-file=/var/log/turnserver.log
no-stdout-log

# Fingerprint in messages
fingerprint

# Don't allow loopback peers
no-loopback-peers

# Mobility (ICE)
mobility

# Security
no-multicast-peers
