# NurChat TURN server (coturn) — NAT traversal for WebRTC calls.
# Credentials MUST match TURN_USERNAME / TURN_CREDENTIAL in .env
# (see shared/config.py). The relay advertises them via /api/calls/ice-servers.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
# Static accounts: user=password (keep in sync with .env!)
user=nurchat:CHANGE_ME_IN_PRODUCTION
realm=nurchat
# Relay ports for media
min-port=49152
max-port=49200
# Protect against abusive relaying
max-bps=10000000
bps-capacity=0
stale-nonce=600
# Logging
log-file=stdout
simple-log
