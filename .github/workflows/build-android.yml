name: Build Android

# Только ручной запуск: Actions -> Build Android -> Run workflow.
# Автозапуск добавим, когда сборка стабильно проходит (тогда — по тегу).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Архитектуры. Обе — полный APK; только aarch64 — быстро, для отладки (на 32-бит не встанет)"
        type: choice
        default: aarch64 armv7
        options:
          - aarch64 armv7
          - aarch64

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install root deps (Tauri CLI)
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Упавшая сборка всё равно сохраняет зависимости: следующая попытка
          # не компилирует их заново.
          cache-on-failure: true

      - name: Setup Android NDK
        # SDK и NDK предустановлены на ubuntu-latest; Tauri ищет NDK через NDK_HOME.
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build APK
        # gen/android закоммичен, поэтому `tauri android init` не нужен.
        # Собираем aarch64 (все современные телефоны) и armv7 (старые 32-бит).
        env:
          TARGETS: ${{ inputs.targets }}
        # $TARGETS без кавычек намеренно: "aarch64 armv7" -> два аргумента.
        run: npx --yes tauri android build --apk --target $TARGETS --ci

      - name: Sign APK
        # Без подписи Android отвечает «пакет недействителен» при установке.
        # Подписываем ключом из секретов ANDROID_KEYSTORE_* (NurChat-signed.apk).
        # Без секретов шаг падает: неподписанный APK не установится.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_IN="$OUT/app-universal-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$APK_IN" "$OUT/app-aligned.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --out "$OUT/NurChat-signed.apk" "$OUT/app-aligned.apk"
            "$BT/apksigner" verify --print-certs "$OUT/NurChat-signed.apk"
            rm -f "$RUNNER_TEMP/release.jks" "$OUT/app-aligned.apk"
          else
            echo "::error::Секреты ANDROID_KEYSTORE_* не заданы — без подписи APK не установится"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # archive: false — выкладываем .apk как есть, без zip и вложенных папок
          # (артефакт скачивается сразу как NurChat-signed.apk; name при этом
          # игнорируется, именем служит имя файла).
          archive: false
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/NurChat-signed.apk
          if-no-files-found: error
          retention-days: 3
