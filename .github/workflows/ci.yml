name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: |
          pip install pytest
          pip install -r requirements.txt
      - run: pytest test/test_crypto.py -v
      - run: pytest test/test_security.py -v

  lint:

          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout
      - name: Lint
        run: ruff check . --ignore E501
      - name: Typecheck
        run: mypy server shared --ignore-missing-imports
        continue-on-error: true
      - name: Run tests
        run: pytest test/ -q --timeout=60 --ignore=test/load_test_websocket.py --ignore=test/load_test_ws.py
        env:
          DATABASE_URL: "sqlite:///./test.db"
          ENCRYPTION_KEY: "test-key-for-ci-only-000000000000000000000000000000"
          JWT_SECRET_KEY: "test-jwt-key-for-ci-only-000000000000000000000000000"
          TOTP_MASTER_KEY: "test-totp-key-for-ci-only-0000000000000000000000"
          USE_REDIS: "false"

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npx vite build

  build:
    runs-on: windows-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build server.exe
        run: |
          pyinstaller --onefile --noconsole --name server.exe `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.lifespan.on" `
            --add-data "shared;shared" `
            --collect-all "multipart" `
            server\main.py `
            --noconfirm

      - name: Upload server.exe
        uses: actions/upload-artifact@v4
        with:
          name: server-windows-${{ github.sha }}
          path: dist/server.exe

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install root deps (для @tauri-apps/cli)
        run: npm install

      - name: Build app (Tauri)
        run: npx --yes tauri build --config src-tauri/tauri.conf.json

      - name: Upload app installer
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nurchat:ci .
