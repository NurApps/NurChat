# NurChat TURN/STUN Server Configuration
# Used by docker-compose coturn service

listening-port=3478
tls-listening-port=5349

# Internal IP (Docker network)
listening-ip=0.0.0.0
relay-ip=0.0.0.0
# external-ip: set to your public IP or use auto-detect
# For local dev, use your LAN IP. For production, use your public IP.
# external-ip=YOUR_PUBLIC_IP

# Relay ports
min-port=49152
max-port=49200

# Auth — use long-term credentials
# CHANGE THESE IN PRODUCTION!
lt-cred-mech
user=nurchat:CHANGE_ME_IN_PRODUCTION
realm=nurchat.local

# Logging
verbose
no-stdout-log

# Fingerprint in messages
fingerprint

# Don't allow loopback peers
no-loopback-peers

# Mobility (ICE)
mobility

# Security
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TCP relay
relay-threads=4

# Minimize logging in production
log-file=/dev/null
