name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # Single pip invocation so the resolver picks one consistent set
        # (a separate `pip install pytest-timeout` can churn pytest versions
        # and break plugin autoload at startup).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest-timeout>=2.0.0"
      - name: Verify dependency consistency
        run: |
          pip check
          python -m pytest --version
      - name: Lint
        run: ruff check . --ignore E501
      - name: Typecheck
        # Scoped since 2026-09: 0 errors on the checked subset.
        # server/ws, server/middleware, models/database/storage и часть
        # роутов исключены в pyproject.toml (исторический долг) — их
        # возврат в тайпчек отслеживается отдельно, не этим джобом.
        run: mypy server shared --ignore-missing-imports
      - name: Run tests
        run: pytest test/ -q --timeout=60 --ignore=test/load_test_websocket.py --ignore=test/load_test_ws.py
        env:
          DATABASE_URL: "sqlite:///./test.db"
          ENCRYPTION_KEY: "test-key-for-ci-only-000000000000000000000000000000"
          JWT_SECRET_KEY: "test-jwt-key-for-ci-only-000000000000000000000000000"
          TOTP_MASTER_KEY: "test-totp-key-for-ci-only-0000000000000000000000"
          USE_REDIS: "false"

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nurchat:ci .
