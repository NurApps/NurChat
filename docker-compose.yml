version: "3.8"

services:
  nurchat:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./nurchat.db:/app/nurchat.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
