name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic pydantic python-jose[cryptography] passlib[bcrypt] python-multipart aiofiles redis
          pip install pytest pytest-asyncio httpx ruff
      - name: Lint
        run: ruff check . --ignore E501
        continue-on-error: true
      - name: Run tests
        run: pytest test/ -v --timeout=30
        env:
          DATABASE_URL: "sqlite:///./test.db"
          ENCRYPTION_KEY: "test-key-for-ci-only-000000000000000000000000000000"
          JWT_SECRET_KEY: "test-jwt-key-for-ci-only-000000000000000000000000000"
          TOTP_MASTER_KEY: "test-totp-key-for-ci-only-0000000000000000000000"

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nurchat:ci .
