# Dependabot: automated dependency updates (security patches while unmaintained).
# Interval is monthly — review and merge the PRs, or enable auto-merge for patch updates.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies", "security"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Мажорные версии — вручную и по одной: typescript 7 ломает typescript-eslint
    # (он явно не поддерживает TS 7), а группа с 8 мажорами падает на npm ci целиком.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-deps:
        patterns: ["*"]
    labels: ["dependencies", "security"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      rust-deps:
        patterns: ["*"]
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
