name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Setup venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt

      - name: Install PyInstaller
        run: .venv\Scripts\pip install pyinstaller

      - name: Build server.exe
        run: |
          .venv\Scripts\pyinstaller --onefile --name server.exe `
            --add-data ".venv\Lib\site-packages;." `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.lifespan.on" `
            --add-data "shared;shared" `
            --collect-all "multipart" `
            server\main.py `
            --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-${{ github.sha }}
          path: dist/server.exe

  build-app:
    runs-on: windows-latest
    needs: [build-server]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Download server.exe
        uses: actions/download-artifact@v4
        with:
          name: server-windows-${{ github.sha }}
          path: src-tauri/binaries

      - name: Rename server.exe for sidecar
        run: |
          Rename-Item -Path "src-tauri\binaries\server.exe" -NewName "server-x86_64-pc-windows-msvc.exe" -ErrorAction SilentlyContinue

      - name: Build app.exe (Tauri)
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          bundleIdentifier: com.nurapps.nurchat

      - name: Upload app installer
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
