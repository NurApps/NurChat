name: Supabase keepalive

# Бесплатный Supabase ставит проект на паузу после недели бездействия.
# Этот крон раз в сутки делает SELECT 1 — этого достаточно, чтобы
# проект считался активным. Работает, даже когда домашний relay выключен.
#
# Настройка (один раз): repo Settings → Secrets and variables → Actions →
# New repository secret: имя SUPABASE_DATABASE_URL, значение — полный
# pooler-URI из Supabase Dashboard (Database → Connect → URI, Session mode),
# например:
#   postgresql://postgres.xxxxx:ПАРОЛЬ@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require

on:
  schedule:
    - cron: "17 4 * * *" # ежедневно ~04:17 UTC
  workflow_dispatch: # ручной запуск для проверки

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Postgres
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            # Без секрета — молча зелёный: иначе у каждого форка без Supabase
            # вечно красный бейдж, хотя коду там нечего проверять.
            echo "::warning::Repo secret SUPABASE_DATABASE_URL is not set — nothing to ping (Settings → Secrets → Actions to enable)"
            exit 0
          fi
          pip install -q "psycopg2-binary>=2.9"
          python -c "import psycopg2, os; c = psycopg2.connect(os.environ['DATABASE_URL']); c.cursor().execute('SELECT 1'); print('Supabase alive'); c.close()"
